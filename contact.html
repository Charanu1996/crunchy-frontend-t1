
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact | Byte-Sized Web</title>
</head>
<body>
  <header>
    <p>Byte-Sized Web</p>

    <nav aria-label="Main navigation">
      <ul>
        <li><a href="index.html">Home</a></li>
        <li><a href="about.html">About</a></li>
        <li><a href="contact.html" aria-current="page">Contact</a></li>
      </ul>
    </nav>
  </header>

  <main>
    <section>
      <h1>Contact Us</h1>
      <p>Have a question or suggestion? Complete the form below.</p>

      <form action="#" method="get">
        <fieldset>
          <legend>Your Details</legend>

          <p>
            <label for="full-name">Full Name:</label>
            <input
              type="text"
              id="full-name"
              name="full-name"
              autocomplete="name"
              required
            >
          </p>

          <p>
            <label for="email">Email Address:</label>
            <input
              type="email"
              id="email"
              name="email"
              autocomplete="email"
              required
            >
          </p>

          <p>
            <label for="topic">Reason for Contact:</label>
            <select id="topic" name="topic" required>
              <option value="">Select a topic</option>
              <option value="feedback">Website Feedback</option>
              <option value="question">Learning Question</option>
              <option value="other">Other</option>
            </select>
          </p>

          <p>
            <label for="message">Your Message:</label>
            <textarea
              id="message"
              name="message"
              rows="6"
              required
            ></textarea>
          </p>

          <button type="submit">Submit Message</button>
        </fieldset>
      </form>
    </section>
  </main>

  <footer>
    <p>Byte-Sized Web — a beginner learning project.</p>
    <p><a href="index.html">Return to Home</a></p>
  </footer>
</body>
</html>
